<!-- Lemon Squeezy 제휴(affiliate) 추적 -->
<script>window.lemonSqueezyAffiliateConfig = { store: "runner-blog-auto" };</script>
<script src="https://lmsqueezy.com/affiliate.js" defer></script>
<style>
  :root{
    --bg:#070a0b; --panel:#0f1416; --panel2:#141b1d; --field-bg:#0c1113;
    --border:#213033; --border2:#2c3d40;
    --text:#eef4f3; --muted:#7f9298; --muted2:#5d6f74;
    --mint:#2ed6c6; --mint2:#49e9d9; --mint-press:#1fbcae; --ink:#04211e;
    --blue:#3aa0ff;
    --accent-tint:rgba(46,214,198,.10); --accent-line:rgba(46,214,198,.40);  /* 절제된 액센트(플랫 컴포넌트용) */
    /* ===== 글래스(반투명 민트블루) 디자인 토큰 ===== */
    --glass:linear-gradient(180deg,rgba(74,233,217,.20),rgba(46,214,198,.085));
    --glass-2:linear-gradient(180deg,rgba(80,238,222,.36),rgba(46,214,198,.16));
    --glass-bd:rgba(120,240,226,.32);
    --glass-bd2:rgba(130,244,230,.55);
    --glass-sheen:inset 0 1px 0 rgba(255,255,255,.22);
    --glass-glow:0 6px 18px rgba(46,214,198,.14);
    --glass-tx:#e9fffb;
    --blur:blur(10px) saturate(1.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:
      radial-gradient(820px 440px at 84% -14%, rgba(18,46,44,.45) 0%, transparent 60%),
      radial-gradient(680px 380px at 4% -8%, rgba(14,34,46,.38) 0%, var(--bg) 58%);
    color:var(--text);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;padding:30px 18px 90px;min-height:100vh;overflow-x:hidden}
  .wrap{max-width:1080px;margin:0 auto}

  /* header */
  .top{display:flex;align-items:center;gap:14px;padding:2px 6px;flex-wrap:wrap}
  .logo{width:40px;height:40px;border-radius:11px;background:var(--panel2);border:1px solid var(--border2);
    display:flex;align-items:center;justify-content:center;flex:none}
  .logo span{font-weight:800;font-size:20px;color:var(--mint);letter-spacing:-.02em;line-height:1}
  .home-link{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;transition:transform .16s ease,filter .18s ease;border-radius:12px}
  .home-link:hover{transform:translateY(-1px);filter:brightness(1.12)}
  .home-link:hover .logo{border-color:var(--accent-line)}
  .home-hint{font-size:11.5px;font-weight:700;color:var(--muted2);border:1px solid var(--border2);border-radius:999px;padding:3px 10px;display:inline-flex;align-items:center;gap:4px;transition:border-color .15s ease,color .15s ease}
  .home-hint::before{content:"←";font-weight:800}
  .home-link:hover .home-hint{border-color:var(--accent-line);color:var(--mint2)}
  @media(max-width:560px){.home-hint{display:none}}
  .brandbox{display:flex;flex-direction:column;line-height:1.15}
  .brand{font-size:19px;font-weight:750;letter-spacing:.02em}
  .brand .wm-a{color:var(--mint)}
  .brand b{color:var(--mint)}
  .brand-sub{color:var(--muted);font-size:12px;margin-top:2px;font-weight:500;letter-spacing:.01em}
  .lang-wrap{margin-left:10px;position:relative}
  .lang-sel{appearance:none;background-color:rgba(46,214,198,.12);border:1px solid var(--glass-bd);color:var(--text);
    box-shadow:var(--glass-sheen);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    font-weight:700;font-size:13px;padding:9px 34px 9px 14px;border-radius:12px;cursor:pointer;font-family:inherit;outline:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237f9298' stroke-width='2.4'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;transition:.15s}
  .lang-sel:hover{border-color:var(--glass-bd2)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:22px 6px 8px}
  .chip{border:1px solid var(--border);color:var(--muted);background:transparent;
    font-weight:500;font-size:13px;padding:7px 13px 7px 11px;border-radius:9px;display:inline-flex;align-items:center;gap:7px}
  .chip svg{width:14px;height:14px;color:var(--mint);flex:none}
  .lede{color:var(--muted);font-size:14.5px;margin:14px 6px 22px;line-height:1.6;max-width:760px}

  /* progress */
  .steps{display:flex;gap:8px;margin:0 6px 20px}
  .steps .s{flex:1;display:flex;align-items:center;gap:9px;padding:12px 15px;border-radius:12px;
    background:var(--panel);border:1px solid var(--border);
    font-size:13.5px;color:var(--muted2);font-weight:550;transition:.15s}
  .steps .s .n{width:22px;height:22px;border-radius:7px;background:transparent;border:1px solid var(--border2);color:var(--muted);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none;font-variant-numeric:tabular-nums}
  .steps .s.active{border-color:var(--accent-line);background:var(--accent-tint);color:var(--text)}
  .steps .s.active .n{background:var(--mint);color:var(--ink);border-color:transparent}

  /* card */
  .card{background:linear-gradient(180deg,#111819,#0e1416);border:1px solid var(--border);
    border-radius:20px;padding:30px 32px;margin-bottom:20px}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .tab{padding:6px 13px;border-radius:10px;background:var(--glass-2);color:var(--glass-tx);border:1px solid var(--glass-bd);
    box-shadow:var(--glass-sheen);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    font-size:12.5px;font-weight:800;letter-spacing:.3px}
  .head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.3px}
  .head-desc{color:var(--muted);font-size:14px;margin:2px 0 22px;line-height:1.55}

  label.fl{display:block;font-weight:700;font-size:14.5px;margin:20px 0 9px}
  label.fl .dim{color:var(--muted);font-weight:500;font-size:13px}
  textarea,input.txt,select{width:100%;background:var(--field-bg);border:1px solid var(--border);
    color:var(--text);border-radius:12px;padding:15px 17px;font-size:14.5px;font-family:inherit;outline:none;transition:.15s}
  textarea{min-height:200px;resize:vertical;line-height:1.6}
  textarea::placeholder,input.txt::placeholder{color:var(--muted2)}
  textarea:focus,input.txt:focus,select:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(46,214,198,.14)}

  .drop{border:1.5px dashed var(--border2);border-radius:14px;padding:38px 20px;text-align:center;
    color:var(--muted);cursor:pointer;transition:.15s}
  .drop:hover{border-color:var(--mint);background:rgba(46,214,198,.04)}
  .drop .ico{font-size:30px;margin-bottom:12px}
  .drop b{color:var(--mint)}
  .drop .hint{color:var(--muted2);font-size:12.5px;margin-top:8px}
  .thumbs{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
  .thumbs img{width:70px;height:70px;object-fit:cover;border-radius:9px;border:1px solid var(--border)}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237f9298' stroke-width='2.4'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 15px center;padding-right:40px}

  .cta{width:100%;margin-top:28px;background:linear-gradient(135deg,var(--mint),#22b7d8);color:var(--ink);border:none;border-radius:14px;
    padding:19px;font-size:17px;font-weight:900;cursor:pointer;letter-spacing:-.2px;transition:.12s;
    box-shadow:0 10px 26px rgba(46,214,198,.24)}
  .cta:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .cta:active{transform:translateY(0)}
  .cta[disabled]{opacity:.55;cursor:default;transform:none;box-shadow:none;filter:none}

  .hidden{display:none}
  .titles{display:flex;flex-direction:column;gap:9px}
  .title-opt{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--border);
    border-radius:11px;padding:14px 16px;cursor:pointer;transition:.12s}
  .title-opt:hover{border-color:var(--border2)}
  .title-opt.sel{border-color:var(--accent-line);background:var(--accent-tint)}
  .title-opt .radio{width:17px;height:17px;border-radius:999px;border:2px solid var(--muted);flex:none}
  .title-opt.sel .radio{border-color:var(--mint);background:var(--mint);box-shadow:inset 0 0 0 3px var(--field-bg)}
  .title-opt span{font-weight:700;font-size:15px}

  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
  .metric{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
  .metric .k{color:var(--muted);font-size:12px;margin-bottom:6px}
  .metric .v{font-size:22px;font-weight:900;letter-spacing:-.5px}
  .metric .v.good{color:var(--mint)}

  .preview-body{background:#fbfdfc;color:#1a2321;border-radius:13px;padding:28px 28px;line-height:1.75;
    font-size:14.5px;max-height:500px;overflow:auto;white-space:pre-wrap}
  .preview-body .subhead{font-weight:800;font-size:16.5px;color:#123330;margin:20px 0 6px;letter-spacing:-.2px}
  .imgmark{display:flex;align-items:center;gap:10px;background:#e2f7f4;border:1px dashed #96d6cd;color:#276b62;
    border-radius:10px;padding:10px 14px;margin:13px 0;font-weight:700;font-size:13px}
  .imgmark .box{width:38px;height:38px;border-radius:8px;background:var(--mint);display:flex;align-items:center;justify-content:center}
  .hashtags{margin-top:8px;color:#1f8f84;font-size:13px}

  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  .gallery .g{border:1px solid var(--border);border-radius:11px;overflow:hidden;background:var(--field-bg)}
  .gallery .g img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover}
  .gallery .g .cap{padding:8px 10px;font-size:11.5px;color:var(--muted)}
  .g.ph{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:var(--muted2);
    font-size:12px;text-align:center;padding:10px}

  .actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
  .btn{flex:1;min-width:200px;border-radius:14px;padding:17px;font-size:15.5px;font-weight:800;cursor:pointer;
    border:1px solid var(--glass-bd);background:var(--glass);color:var(--glass-tx);box-shadow:var(--glass-sheen),var(--glass-glow);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transition:.12s}
  .btn:hover{border-color:var(--glass-bd2);filter:brightness(1.08)}
  .btn.primary{background:linear-gradient(135deg,var(--mint),#22b7d8);color:var(--ink);border-color:transparent}
  .btn.primary:hover{filter:brightness(1.06)}
  .note{color:var(--muted);font-size:12.5px;margin-top:13px;line-height:1.6}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0f1a1b;border:1px solid var(--mint);
    color:var(--text);padding:13px 22px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.45);display:none;z-index:50}
  .spin{width:17px;height:17px;border:2.5px solid rgba(4,33,30,.35);border-top-color:var(--ink);border-radius:999px;
    display:inline-block;vertical-align:-3px;margin-right:8px;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* ===== 모바일 반응형 (이탈률↓) ===== */
  @media(max-width:820px){
    .row2,.metrics,.gallery{grid-template-columns:1fr 1fr}
  }
  @media(max-width:600px){
    html{-webkit-text-size-adjust:100%}
    body{padding:16px 12px 72px}
    /* 상단바: 로고+브랜드+언어는 1줄, 로그인/버튼들은 아래 줄 full-width */
    .top{flex-wrap:wrap;gap:10px;padding:0 2px}
    .logo{width:40px;height:40px;font-size:21px;border-radius:12px}
    .brand{font-size:18px}
    .brand-sub{font-size:11.5px;margin-top:2px}
    .lang-sel{font-size:12.5px;padding:8px 30px 8px 12px}
    .auth-wrap{order:3;width:100%;margin-left:0;flex-wrap:wrap;justify-content:flex-start;gap:8px}
    .user-chip b{max-width:130px}
    .steps{flex-direction:column}
    .chips{margin:16px 2px 6px;gap:6px}
    .chip{font-size:11.5px;padding:6px 10px}
    .lede{font-size:13.5px;margin:12px 2px 18px;line-height:1.55}
    .card{padding:20px 16px;border-radius:16px;margin-bottom:16px}
    .head h2{font-size:17px}
    .head-desc{font-size:13px;margin-bottom:18px}
    label.fl{font-size:14px;margin:16px 0 8px}
    /* iOS 포커스 시 화면 확대(줌) 방지 → 입력 폰트 16px 이상 */
    textarea,input.txt,select{font-size:16px;padding:13px 14px}
    textarea{min-height:160px}
    .drop{padding:26px 14px}
    .drop .ico{font-size:26px}
    .thumbs img{width:60px;height:60px}
    .row2{grid-template-columns:1fr;gap:14px}
    .metrics{grid-template-columns:repeat(2,1fr);gap:9px}
    .metric{padding:13px}
    .metric .v{font-size:19px}
    .gallery{grid-template-columns:repeat(2,1fr);gap:9px}
    .preview-body{padding:18px 16px;font-size:14px;max-height:60vh}
    .cta{padding:16px;font-size:16px;margin-top:22px}
    .actions{gap:9px}
    .btn{flex:1 1 100%;min-width:0;padding:15px;font-size:15px}
    .mini-actions{gap:7px}
    .mini-btn{font-size:12.5px;padding:9px 12px}
    .modal-bg{padding:14px}
    .modal{padding:24px 20px;border-radius:18px}
    .modal-h{font-size:18px}
    .ladder{gap:4px}
    .ladder .lad{padding:8px 2px}
    .ladder .lad .lt{font-size:10px}
    .ladder .lad .ld{font-size:12.5px}
    .ladder .arw{font-size:11px}
    .plan-card{padding:13px 14px}
    .plan-card .nm{font-size:14.5px}
    .plan-card .pr{font-size:18px}
    .site-foot{font-size:12px}
    .site-foot .dot{margin:0 5px}
  }
  @media(max-width:380px){
    .brand{font-size:16.5px}
    .auth-btn,.invite-btn,.up-btn{font-size:11.5px;padding:7px 10px}
    .usage-chip{font-size:11px;padding:6px 9px}
    .metrics{grid-template-columns:1fr 1fr}
    .ladder .lad .lt{font-size:9px}
    .ladder .lad .ld{font-size:11.5px}
  }

  /* progress bar (생성 중) */
  .prog-wrap{margin-top:18px}
  .prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .prog-label{color:var(--muted);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
  .prog-pct{color:var(--mint);font-weight:900;font-size:15px;letter-spacing:-.3px}
  .prog-track{height:11px;border-radius:999px;background:var(--field-bg);border:1px solid var(--border);overflow:hidden}
  .prog-bar{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--mint),#22b7d8);
    transition:width .35s cubic-bezier(.25,.8,.3,1);box-shadow:0 0 14px rgba(46,214,198,.5)}

  /* result toolbar */
  .mini-actions{display:flex;gap:9px;margin:-4px 0 22px;flex-wrap:wrap}
  .mini-btn{background:var(--glass);border:1px solid var(--glass-bd);color:var(--glass-tx);font-weight:700;
    box-shadow:var(--glass-sheen);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    font-size:13.5px;padding:10px 15px;border-radius:12px;cursor:pointer;font-family:inherit;transition:.15s;
    display:inline-flex;align-items:center;gap:7px}
  .mini-btn:hover{border-color:var(--glass-bd2);filter:brightness(1.08)}
  .mini-btn.accent{border-color:var(--glass-bd2);color:var(--glass-tx);background:var(--glass-2);box-shadow:var(--glass-sheen),var(--glass-glow)}

  /* auth */
  .auth-wrap{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
  .usage-chip{font-size:12px;font-weight:700;color:var(--glass-tx);background:var(--glass);
    border:1px solid var(--glass-bd);box-shadow:var(--glass-sheen);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    padding:8px 12px;border-radius:11px;white-space:nowrap}
  .auth-btn{background:var(--glass);border:1px solid var(--glass-bd);color:var(--glass-tx);font-weight:700;
    box-shadow:var(--glass-sheen);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    font-size:13px;padding:9px 15px;border-radius:12px;cursor:pointer;font-family:inherit;transition:.15s}
  .auth-btn:hover{border-color:var(--glass-bd2);filter:brightness(1.08)}
  .user-chip{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted)}
  .user-chip b{color:var(--text);font-weight:700;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .auth-link{background:none;border:none;color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer;
    font-family:inherit;text-decoration:underline;padding:4px}
  .auth-link:hover{color:var(--mint)}

  .modal-bg{position:fixed;inset:0;background:rgba(2,6,7,.72);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal{position:relative;width:100%;max-width:420px;background:linear-gradient(180deg,#121a1b,#0e1416);
    border:1px solid var(--border2);border-radius:20px;padding:30px 28px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .modal-logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--mint),#1f9fd6);
    display:flex;align-items:center;justify-content:center;font-size:23px;margin-bottom:16px}
  .modal-h{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .modal-d{color:var(--muted);font-size:13.5px;margin:6px 0 20px;line-height:1.55}
  .modal .or{display:flex;align-items:center;gap:12px;color:var(--muted2);font-size:12px;margin:16px 0}
  .modal .or::before,.modal .or::after{content:"";flex:1;height:1px;background:var(--border)}
  .modal-x{position:absolute;top:16px;right:18px;background:none;border:none;color:var(--muted);
    font-size:18px;cursor:pointer;line-height:1}
  .modal-x:hover{color:var(--text)}

  /* upgrade */

    font-size:12.5px;padding:8px 13px;border-radius:10px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .up-btn:hover{filter:brightness(1.06)}
  .invite-btn{background:linear-gradient(180deg,rgba(255,216,128,.28),rgba(255,207,107,.12));
    border:1px solid rgba(255,216,140,.5);color:#ffe1a4;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.22);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    font-size:12.5px;padding:9px 14px;border-radius:12px;cursor:pointer;font-family:inherit;white-space:nowrap}

  /* 헤더 버튼·칩·스텝 인터랙션 */
  .chip{transition:transform .16s ease,border-color .18s ease,color .18s ease,background .18s ease}
  .chip:hover{transform:translateY(-2px);border-color:var(--accent-line);color:var(--text);background:var(--accent-tint)}
  .chip:hover svg{color:var(--mint2)}
  .steps .s{transition:transform .16s ease,border-color .18s ease,background .18s ease,box-shadow .18s ease,color .18s ease}
  .steps .s:not(.active):hover{transform:translateY(-3px);border-color:var(--accent-line);background:var(--accent-tint);color:var(--text);box-shadow:0 10px 26px rgba(46,214,198,.15)}
  .steps .s:not(.active):hover .n{border-color:var(--accent-line);color:var(--mint2)}
  .steps .s.active:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(46,214,198,.22)}
  .invite-btn,.up-btn{transition:transform .15s ease,filter .18s ease,box-shadow .18s ease}
  .invite-btn:hover,.up-btn:hover{transform:translateY(-2px)}
  .up-btn:hover{box-shadow:0 8px 22px rgba(46,214,198,.28)}
  .invite-btn:active,.up-btn:active{transform:translateY(0) scale(.97)}
  .usage-chip{transition:transform .15s ease,filter .18s ease,border-color .15s ease}
  .usage-chip:hover{transform:translateY(-1px);filter:brightness(1.1);border-color:var(--glass-bd2)}
  .auth-link{transition:color .15s ease,transform .15s ease,filter .15s ease}
  .auth-link:hover{transform:translateY(-1px);filter:brightness(1.15)}
  .lang-sel{transition:transform .15s ease,border-color .15s ease,filter .15s ease}
  .lang-sel:hover{transform:translateY(-1px);filter:brightness(1.08)}
  /* 레퍼럴 정책 카드 */
  .refer-box{margin-top:14px;position:relative;overflow:hidden;border:1px solid var(--accent-line);

  .refer-h{font-size:20px;font-weight:800;margin:14px 0 8px;letter-spacing:-.01em;color:var(--text)}
  .refer-p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 18px;max-width:640px}
  .refer-steps{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .rf-step{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border2);border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600;color:var(--text);transition:transform .15s ease,border-color .15s ease}
  .rf-step:hover{transform:translateY(-2px);border-color:var(--accent-line)}
  .rf-n{width:20px;height:20px;border-radius:6px;background:var(--mint);color:var(--ink);font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
  .rf-arrow{color:var(--muted2);font-weight:800}
  .refer-cta{background:linear-gradient(135deg,var(--mint),#22b7d8);color:var(--ink);border:none;font-weight:800;font-size:14.5px;padding:13px 24px;border-radius:12px;cursor:pointer;font-family:inherit;transition:transform .15s ease,filter .18s ease,box-shadow .18s ease}
  .refer-cta:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 10px 26px rgba(46,214,198,.28)}

  .plans{display:flex;flex-direction:column;gap:11px;margin-top:18px}

    padding:15px 18px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:space-between;font-family:inherit;color:var(--text);width:100%}
  .plan-card:hover{border-color:var(--border2)}

  /* USDT(크립토) 결제 옵션 */
  .crypto-row{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
  .crypto-label{color:var(--muted);font-size:12.5px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .crypto-btns{display:flex;gap:8px;flex-wrap:wrap}
  .crypto-btn{flex:1;min-width:92px;background:var(--glass);border:1px solid var(--glass-bd);color:var(--glass-tx);
    box-shadow:var(--glass-sheen);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    font-weight:800;font-size:12.5px;padding:9px 10px;border-radius:11px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.12s}
  .crypto-btn:hover{border-color:var(--glass-bd2);filter:brightness(1.08)}
  /* footer */
  .site-foot{text-align:center;margin:26px 6px 0;color:var(--muted2);font-size:12.5px}
  .site-foot a{color:var(--muted);text-decoration:none}
  .site-foot a:hover{color:var(--mint);text-decoration:underline}
  .site-foot .dot{margin:0 8px;color:var(--muted2)}
  .site-foot .foot-copy{margin-top:8px;color:var(--muted2);font-size:11.5px}
  /* 할인 사다리 (무료→1→6→12) */
  .ladder{display:flex;align-items:stretch;gap:5px;margin-top:16px}
  .ladder .lad{flex:1;text-align:center;border:1px solid var(--glass-bd);border-radius:12px;padding:10px 3px;
    background:var(--glass);box-shadow:var(--glass-sheen);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
  .ladder .lad .lt{font-size:11px;color:var(--muted);font-weight:700}
  .ladder .lad .ld{font-size:14px;font-weight:900;margin-top:3px;color:var(--muted2)}
  .ladder .lad.off1{border-color:var(--border2);background:var(--panel2)}
  .ladder .lad.off1 .ld{color:var(--mint2)}
  .ladder .lad.off2{border-color:var(--accent-line);background:var(--accent-tint)}
  .ladder .lad.off2 .ld{color:var(--mint)}
  .ladder .arw{align-self:center;color:var(--muted2);font-size:13px;font-weight:900}
  .plan-card .base{color:var(--muted2);text-decoration:line-through;font-size:12px;margin-right:6px}
  .sv-chip{display:inline-block;font-weight:800;font-size:12px;border-radius:7px;padding:2px 8px;margin-top:3px}
  .sv-chip.s1{color:var(--mint2);background:rgba(46,214,198,.10)}
  .sv-chip.s2{color:var(--ink);background:var(--mint)}
  .sv-flat{color:var(--muted2);font-size:12px;margin-top:3px}
  /* rolling cube pricing (landing과 통일) */
  #pricingLadder:empty,#upLadder:empty{display:none}
  .pcar-wrap{margin-top:16px;position:relative;display:flex;align-items:center;gap:6px}
  .pcar{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:8px 4px 14px;scrollbar-width:none;-ms-overflow-style:none;flex:1;min-width:0;cursor:grab;scroll-behavior:smooth;overscroll-behavior-x:contain}
  .pcar.dragging{cursor:grabbing;scroll-behavior:auto}
  .pcar.dragging .pcube{pointer-events:none}
  .pcar::-webkit-scrollbar{display:none}
  .pcube{scroll-snap-align:center;flex:1 0 200px;min-height:300px;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;cursor:pointer;transition:background .3s ease,border-color .3s ease,box-shadow .3s ease,opacity .3s ease,transform .16s ease;opacity:.6;text-align:left}
  .pcube:hover{opacity:1;border-color:var(--accent-line);background:rgba(46,214,198,.05);transform:translateY(-5px);box-shadow:0 16px 40px rgba(46,214,198,.16)}
  .pcube:hover .pc-price{color:var(--mint2)}
  .pcube:active{transform:scale(.985)}
  .pcube.sel{opacity:1;background:var(--accent-tint);border-color:var(--accent-line);box-shadow:0 0 0 1px var(--accent-line),0 16px 44px rgba(46,214,198,.18);transform:translateY(-3px)}
  .pcube.sel:hover{transform:translateY(-6px);box-shadow:0 0 0 1px var(--accent-line),0 22px 56px rgba(46,214,198,.24)}
  .pcube.pop{animation:cubePop .4s cubic-bezier(.34,1.45,.5,1)}
  @keyframes cubePop{0%{transform:translateY(-3px) scale(1)}45%{transform:translateY(-3px) scale(1.04)}100%{transform:translateY(-3px) scale(1)}}
  .pc-price{transition:color .3s ease}
  .pc-cta{transition:background .2s ease,color .2s ease,opacity .2s ease,transform .13s ease,filter .18s ease}
  .pcube.sel .pc-cta:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .pc-cta:active{transform:scale(.97)}
  .crypto-btn{transition:transform .15s ease,border-color .15s ease,filter .18s ease}
  .crypto-btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
  .pcar-nav{transition:transform .15s ease,border-color .15s ease,color .15s ease}
  .pcar-nav:active{transform:scale(.92)}
  .pc-badge{align-self:flex-start;font-size:10.5px;font-weight:800;color:var(--ink);background:var(--mint);padding:3px 10px;border-radius:8px;margin-bottom:12px;line-height:1.4}
  .pc-badge.ghost{visibility:hidden}
  .pc-name{font-size:16px;font-weight:800;color:var(--text)}
  .pc-price{font-size:30px;font-weight:900;letter-spacing:-.02em;margin-top:5px;color:var(--text);line-height:1}
  .pcube.sel .pc-price{color:var(--mint2)}
  .pc-price span{font-size:14px;font-weight:600;color:var(--muted)}
  .pc-per{font-size:12.5px;color:var(--muted2);margin-top:6px;margin-bottom:15px}
  .pc-feats{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:8px;flex:1}
  .pc-feats li{position:relative;padding-left:20px;font-size:12.5px;color:var(--muted);line-height:1.45}
  .pc-feats li::before{content:"✓";position:absolute;left:0;color:var(--mint);font-weight:900}
  .pc-feats li b{color:var(--text);font-weight:800}
  .pc-cta{width:100%;border:1px solid var(--border2);background:var(--panel2);color:var(--muted);border-radius:11px;padding:11px 0;font-size:13.5px;font-weight:700;cursor:pointer;pointer-events:none;opacity:.5;transition:.2s;font-family:inherit}
  .pcube.sel .pc-cta{pointer-events:auto;opacity:1;background:linear-gradient(135deg,var(--mint),#22b7d8);color:var(--ink);border-color:transparent}
  .pcar-nav{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--border2);background:var(--panel);color:var(--text);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
  .pcar-nav:hover{border-color:var(--mint);color:var(--mint)}
  @media(max-width:560px){.pcar-nav{display:none}.pcube{flex-basis:215px;min-height:280px}}
</style>
</head>

const SUPPORTED = ["en","ko","ja","zh","es"];
let LANG = "en";
function pickLang(){
  let saved=null;
  try{ saved=localStorage.getItem("rb_lang"); }catch(e){}
  if(saved && SUPPORTED.includes(saved)) return saved;
  const nav=(navigator.languages && navigator.languages[0]) || navigator.language || "en";
  const base=nav.toLowerCase().split("-")[0];
  if(SUPPORTED.includes(base)) return base;
  return "en";
}
function T(key){ return (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key; }

function applyI18n(){
  document.documentElement.lang = LANG;
  document.title = LANG==="ko" ? "AIRNOTE — 러닝 기록을 블로그로"
                 : LANG==="ja" ? "AIRNOTE — ランの記録をブログに"
                 : LANG==="zh" ? "AIRNOTE — 把跑步记录变成博客"
                 : LANG==="es" ? "AIRNOTE — Tus carreras, hechas blog"
                 : "AIRNOTE — Turn your runs into blogs";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = T(el.getAttribute("data-i18n")); });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{ el.innerHTML = T(el.getAttribute("data-i18n-html")); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{ el.setAttribute("placeholder", T(el.getAttribute("data-i18n-ph"))); });
  const btn=document.getElementById("genBtn");
  if(btn && !btn.disabled) btn.textContent = T("genBtn");
  if(typeof updateAuthUI==="function") updateAuthUI();
  if(typeof renderPricing==="function") renderPricing();   // 메인 요금제 섹션 갱신
  if(current) render(current); // re-render dynamic content in new language
}

// ===== 진행률 바 (예상 진행률: 초반 빠르게 → 후반 천천히, 완료 시 100%) =====
let progTimer=null, progStart=0;
function setProg(pct){
  $('#progBar').style.width=pct.toFixed(1)+'%';
  $('#progPct').textContent=Math.round(pct)+'%';
  const stg = pct>=82?'stg4' : pct>=55?'stg3' : pct>=22?'stg2' : 'stg1';
  $('#progLabelText').textContent=T(stg);
}
function progStart_(){
  $('#genTitle').textContent=T('genTitle');
  $('#genNote').textContent=T('genNote');
  $('#genModal').style.display='flex';                    // 화면 중앙 오버레이
  progStart=performance.now(); setProg(0);
  if(progTimer) clearInterval(progTimer);
  progTimer=setInterval(()=>{
    const t=(performance.now()-progStart)/1000;           // 경과(초)
    const pct=92*(1-Math.exp(-t/14));                      // ~30s에 약 80%, 92% 넘지 않음
    setProg(pct);
  }, 120);
}
function progStop(done){
  if(progTimer){ clearInterval(progTimer); progTimer=null; }
  if(done){ setProg(100); setTimeout(()=>{ $('#genModal').style.display='none'; }, 450); }
  else { $('#genModal').style.display='none'; }
}

$('#genBtn').onclick=async()=>{
  const text=$('#srcText').value.trim();
  if(!text && files.length===0){toast(T('tNeed'));return;}
  if(AUTH.enabled && !AUTH.session){ openLogin(); return; }   // 로그인 필요
  const btn=$('#genBtn');btn.disabled=true;btn.innerHTML='<span class="spin"></span>'+T('qLoading');
  try{
    const fd=new FormData();
    fd.append('text',text); fd.append('lang',LANG); fd.append('n_photos',files.length);
    const headers={};
    if(AUTH.session && AUTH.session.access_token) headers['Authorization']='Bearer '+AUTH.session.access_token;
    const res=await fetch('/api/questions',{method:'POST',body:fd,headers});
    if(res.status===401){ AUTH.session=null; updateAuthUI(); openLogin(); toast(T('loginNeeded')); btn.disabled=false; btn.textContent=T('genBtn'); return; }
    let qd=null; try{ qd=await res.json(); }catch(_){ qd=null; }
    Q_ITEMS=(qd&&qd.questions&&qd.questions.length)?qd.questions:[];
  }catch(e){ Q_ITEMS=[]; }   // 질문 실패해도 생성은 진행 (건너뛴 것과 동일)
  btn.disabled=false; btn.textContent=T('genBtn');
  if(Q_ITEMS.length){ openQuestions(); }
  else { doGenerate(''); }   // 질문을 못 만들었으면 바로 생성
};

// 질문 답변을 "질문: 답변" 재료 텍스트로 조립
function collectAnswers(){
  const lines=[];
  $('#qList').querySelectorAll('input.q-a').forEach(inp=>{
    const v=inp.value.trim(); if(!v) return;
    const i=+inp.getAttribute('data-qi'); const q=(Q_ITEMS[i]&&Q_ITEMS[i].q)||'';
    lines.push(q?`- ${q} → ${v}`:`- ${v}`);
  });
  return lines.join('\n');
}

async function doGenerate(answersText){
  const text=$('#srcText').value.trim();
  const btn=$('#genBtn');btn.disabled=true;btn.innerHTML='<span class="spin"></span>'+T('genLoading');
  const reset=()=>{progStop(false);btn.disabled=false;btn.textContent=T('genBtn');};
  progStart_();
  let data=null;
  try{
    const fd=new FormData();
    fd.append('text',text);fd.append('keywords',$('#keywords').value);
    fd.append('length',$('#length').value);fd.append('proof',$('#proof').value);
    fd.append('lang',LANG);
    if(answersText) fd.append('answers',answersText);   // 스마트 답변을 재료로 전달
    files.forEach(f=>fd.append('shots',f));
    const headers={};
    if(AUTH.session && AUTH.session.access_token) headers['Authorization']='Bearer '+AUTH.session.access_token;
    const res=await fetch('/api/generate',{method:'POST',body:fd,headers});
    try{ data=await res.json(); }catch(_){ data=null; }
    if(res.status===401){ AUTH.session=null; updateAuthUI(); openLogin(); toast(T('loginNeeded')); reset(); return; }
    if(res.status===402){ const n=(data&&data.limit)||AUTH.freeLimit; progStop(false); updateUsage(data); showLimit(n); btn.disabled=false; btn.textContent=T('genBtn'); return; }
    if(!res.ok){
      const msg=(data&&data.error)?data.error:(T('tServer')+' ('+res.status+')');
      toast('⚠ '+msg); reset(); return;   // 실패 시 가짜 글로 바꿔치기 금지 — 진짜 에러를 보여줌
    }
  }catch(e){
    toast('⚠ '+T('tNetErr')); reset(); return;   // 서버에 도달 못함 — 데모로 위장하지 않음
  }
  // 서버가 준 진짜 결과만 사용
  current=data;
  progStop(true);
  render(current);
  if(data.usage) updateUsage(data.usage);
  $('#step2').classList.remove('hidden');$('#step3').classList.remove('hidden');
  setStep(2);$('#step2').scrollIntoView({behavior:'smooth'});
  btn.disabled=false; btn.textContent=T('genBtn');
}

function render(d){
  const tw=$('#titles');tw.innerHTML='';
  (d.title_options||[d.title]).forEach((t,i)=>{
    const sel = (d.title ? t===d.title : i===0);
    const el=document.createElement('div');el.className='title-opt'+(sel?' sel':'');
    el.innerHTML=`<div class="radio"></div><span></span>`;
    el.querySelector('span').textContent=t;
    el.onclick=()=>{[...tw.children].forEach(c=>c.classList.remove('sel'));el.classList.add('sel');current.title=t;};
    tw.appendChild(el);
  });
  const mw=$('#metrics');mw.innerHTML='';
  const rep=(d.keyword_report||[]).slice(0,4);
  if(rep.length){
    rep.forEach(r=>{const el=document.createElement('div');el.className='metric';
      el.innerHTML=`<div class="k"></div><div class="v">${(r.volume||0).toLocaleString()}<span style="font-size:12px;color:var(--muted)"> ${T('mSearch')}</span></div>
        <div class="k" style="margin-top:8px">${T('mScore')} <b class="v good" style="font-size:15px">${r.golden??'-'}</b></div>`;
      el.querySelector('.k').textContent=r.keyword;
      mw.appendChild(el);});
  }else{const el=document.createElement('div');el.className='metric';el.style.cssText='grid-column:1/-1;color:var(--muted)';el.textContent=T('metricsEmpty');mw.appendChild(el);}
  const bp=$('#bodyPreview');
  const photoW=T('photo');
  let html=esc(d.body||'').replace(/\[사진(\d+)\]/g,(m,n)=>{
    const im=(d.images||[]).find(x=>x.id==n);const lab=im?(im.label||im.type):photoW;
    return `<div class="imgmark"><div class="box">🖼️</div>[${photoW}${n}] · ${esc(lab)}</div>`;})
    .replace(/(^|\n)##\s*([^\n]+)/g,(m,pre,t)=>`${pre}<div class="subhead">${t}</div>`);
  bp.innerHTML=html+`<div class="hashtags">${esc((d.hashtags||[]).join(' '))}</div>`;
  const g=$('#gallery');g.innerHTML='';
  (d.images||[]).forEach(im=>{const cell=document.createElement('div');cell.className='g';
    const cap=`[${photoW}${im.id}] ${im.label||im.type}`;
    if(im.url){cell.innerHTML=`<img src="${im.url}"><div class="cap"></div>`;cell.querySelector('.cap').textContent=cap;}
    else{cell.innerHTML=`<div class="g ph">🖼️<br></div>`;cell.querySelector('.ph').insertAdjacentText('beforeend',cap);}
    g.appendChild(cell);});
}

// ===== export (platform-agnostic) =====
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function slotText(n){return `📷 [${T('photo')}${n}] ${T('imgHere')}`;}
function buildHTML(d){
  let h=`<h1>${esc(d.title)}</h1>\n`;
  (d.body||'').split(/\n{2,}/).forEach(block=>{
    const hm=block.trim().match(/^##\s*(.+)$/);
    if(hm){h+=`<h2>${esc(hm[1])}</h2>\n`;return;}
    const m=block.trim().match(/^\[사진(\d+)\]$/);
    if(m){h+=`<p>${esc(slotText(m[1]))}</p>\n`;}
    else{h+=`<p>${esc(block).replace(/\n/g,'<br>')}</p>\n`;}
  });
  if((d.hashtags||[]).length) h+=`<p>${esc(d.hashtags.join(' '))}</p>\n`;
  return h;
}
function buildMD(d){
  let t=`# ${d.title}\n\n`;
  (d.body||'').split(/\n{2,}/).forEach(block=>{
    const m=block.trim().match(/^\[사진(\d+)\]$/);
    t+= m?`> ${slotText(m[1])}\n\n`:block+"\n\n";
  });
  if((d.hashtags||[]).length) t+=d.hashtags.join(' ')+"\n";
  return t;
}
function buildText(d){
  const body=(d.body||'').replace(/^##\s*/gm,'').replace(/\[사진(\d+)\]/g,(m,n)=>slotText(n));
  return (d.title||'')+"\n\n"+body+"\n\n"+((d.hashtags||[]).join(' '));
}
async function copyRich(html, plain){
  try{
    if(navigator.clipboard && window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({
        'text/html':new Blob([html],{type:'text/html'}),
        'text/plain':new Blob([plain],{type:'text/plain'})
      })]);
    }else{ await navigator.clipboard.writeText(plain); }
    return true;
  }catch(e){ try{await navigator.clipboard.writeText(plain);return true;}catch(_){return false;} }
}
$('#copyHtmlBtn').onclick=async()=>{ await copyRich(buildHTML(current), buildText(current)); toast(T('tHtml')); };
$('#copyMdBtn').onclick=async()=>{ await navigator.clipboard.writeText(buildMD(current)); toast(T('tMd')); };
$('#copyTextBtn').onclick=async()=>{ await navigator.clipboard.writeText(buildText(current)); toast(T('tText')); };
$('#dlImagesBtn').onclick=async()=>{
  const flist=(current.images||[]).map(i=>i.file).filter(Boolean);
  if(!flist.length){toast(T('tNoImg'));return;}
  try{
    const res=await fetch('/api/export/images',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({files:flist})});

    toast(T('tZip'));
  }catch(e){toast(T('tZipServer'));}
};

let SB=null;
const AUTH={enabled:false, session:null, freeLimit:3, url:"", anon:""};

async function initAuth(){
  try{
    const cfg=await (await fetch('/api/config')).json();
    AUTH.enabled=!!cfg.authEnabled; AUTH.freeLimit=cfg.freeLimit||3;
    AUTH.url=cfg.supabaseUrl||""; AUTH.anon=cfg.supabaseAnonKey||"";
  }catch(e){ AUTH.enabled=false; }
  if(AUTH.enabled && AUTH.url && AUTH.anon && window.supabase){
    SB=window.supabase.createClient(AUTH.url, AUTH.anon);
    try{ const {data}=await SB.auth.getSession(); AUTH.session=data.session||null; }catch(_){}
    SB.auth.onAuthStateChange((_e,s)=>{ AUTH.session=s||null; updateAuthUI(); if(s) fetchUsage(); });
  }
  $('#authWrap').style.display = AUTH.enabled ? 'flex' : 'none';
  updateAuthUI();
  if(AUTH.session) fetchUsage();   // 이미 로그인 상태면 새로고침 직후 바로 표시
}
function openLogin(){ if(AUTH.enabled) $('#loginModal').style.display='flex'; }
function closeLogin(){ $('#loginModal').style.display='none'; }
function updateAuthUI(){
  if(!AUTH.enabled) return;
  const lb=$('#loginBtn'), uc=$('#userChip');
  if(lb) lb.textContent=T('login');
  if($('#logoutBtn')) $('#logoutBtn').textContent=T('logout');
  const s=AUTH.session;
  if(s && s.user){
    if(lb) lb.style.display='none';
    if(uc) uc.style.display='flex';
    if($('#userEmail')) $('#userEmail').textContent=s.user.email||'';
  }else{
    if(lb) lb.style.display='';
    if(uc) uc.style.display='none';
    if($('#usageChip')) $('#usageChip').style.display='none';
    PLAN='free';
  }
  if(typeof refreshUpBtn==='function') refreshUpBtn();
}
let PLAN='free';
let LAST_USAGE=null;   // 언어 전환 시 사용량 칩을 다시 그리기 위해 마지막 값 보관
function updateUsage(u){
  if(!u) return;
  LAST_USAGE=u;
  if(u.plan){ PLAN=u.plan; refreshUpBtn(); }
  if(u.used==null || u.limit==null) return;
  const chip=$('#usageChip');
  chip.style.display='inline-block';
  const remain = (u.remaining!=null) ? u.remaining : Math.max(0, u.limit-u.used);
  const tag = (PLAN==='pro') ? 'Pro · ' : '';
  chip.textContent=`${tag}${T('thisMonth')} ${u.used}/${u.limit} · ${T('remain')} ${remain}`;
}
function refreshUpBtn(){
  const b=$('#upBtn'); if(!b) return;
  if(!(AUTH.enabled && AUTH.session)){ b.style.display='none'; return; }
  // 결제 후에도 요금제를 볼 수 있게 버튼 유지 (Pro면 "요금제", 무료면 "✨ 업그레이드")
  b.style.display='inline-block';
  b.textContent = (PLAN==='pro') ? T('plansBtn') : T('upgradeBtn');
}

  const win = window.open('about:blank','_blank');
  const headers={'Content-Type':'application/json'};
  if(AUTH.session && AUTH.session.access_token) headers['Authorization']='Bearer '+AUTH.session.access_token;
  try{
    const r=await fetch('/api/crypto/create',{method:'POST',headers,body:JSON.stringify({plan:k})});
    const d=await r.json().catch(()=>({}));
    if(d.invoice_url){
      if(win){ win.location.href=d.invoice_url; } else { window.location.href=d.invoice_url; }
    }else{
      if(win){ win.close(); }
      toast('⚠ '+(d.error||('결제 생성 실패 ('+r.status+')')));
      console.error('crypto/create 실패:', r.status, d);
    }
  }catch(e){
    if(win){ win.close(); }
    toast('⚠ '+T('tNetErr'));
    console.error('crypto/create 오류:', e);
  }
}
// 할인 사다리: 무료 → 1개월 → 6개월 → 12개월 (오른쪽으로 갈수록 할인↑)
function buildLadder(lw){
  if(!lw) return;
  const LAD=[
    {t:T('planFree'), d:T('baseWord'), cls:''},
    {t:T('up1'),      d:T('baseWord'), cls:''},
    {t:T('up6'),      d:'17%↓',        cls:'off1'},
    {t:T('up12'),     d:'33%↓',        cls:'off2'},
  ];
  lw.innerHTML='';
  LAD.forEach((x,i)=>{
    if(i>0){ const a=document.createElement('div'); a.className='arw'; a.textContent='›'; lw.appendChild(a); }
    const el=document.createElement('div'); el.className=('lad '+x.cls).trim();
    el.innerHTML=`<div class="lt"></div><div class="ld"></div>`;
    el.querySelector('.lt').textContent=x.t; el.querySelector('.ld').textContent=x.d;
    lw.appendChild(el);
  });
}
let SELP='6m';
function centerCube(car,el,smooth){ if(!car||!el) return; car.scrollTo({left: el.offsetLeft-(car.clientWidth-el.clientWidth)/2, behavior: smooth?'smooth':'auto'}); }
function buildPlanCards(wrap){
  if(!wrap) return;
  const pm=T('perMo');
  wrap.innerHTML='';
  const cubes=[{k:'free',name:T('planFree'),price:'$0',permo:false,per:T('pcFreePer'),feats:[T('pcFree1'),T('pcFree2'),T('pcFree3')],badge:'',free:true}];
  PLAN_DATA.forEach(p=>{
    const per=p.save?(p.total+' · '+p.save+' '+T('offWord')):T('baseWord');
    const badge=p.best?T('upBest'):(p.k==='6m'?T('pcPop'):'');
    cubes.push({k:p.k,name:T(p.nameKey),price:p.permo,permo:true,per:per,feats:[T('pcPro1'),T('pcPro2'),T('pcPro3')],badge:badge});
  });
  const wrapEl=document.createElement('div');wrapEl.className='pcar-wrap';
  const prev=document.createElement('button');prev.className='pcar-nav';prev.type='button';prev.textContent='‹';
  const car=document.createElement('div');car.className='pcar';
  const next=document.createElement('button');next.className='pcar-nav';next.type='button';next.textContent='›';
  cubes.forEach(c=>{
    const el=document.createElement('div');el.className='pcube'+(c.k===SELP?' sel':'');
    const badge=c.badge?`<div class="pc-badge">${c.badge}</div>`:`<div class="pc-badge ghost">·</div>`;
    const priceHtml=c.permo?`${c.price}<span>${pm}</span>`:c.price;
    el.innerHTML=`${badge}<div class="pc-name">${c.name}</div><div class="pc-price">${priceHtml}</div><div class="pc-per">${c.per}</div><ul class="pc-feats">${c.feats.map(f=>`<li>${f}</li>`).join('')}</ul><button class="pc-cta" type="button">${T('pcCta')}</button>`;
    const selectThis=()=>{
      car.querySelectorAll('.pcube').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');SELP=c.k;
      el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
      setTimeout(()=>el.classList.remove('pop'),420);
      if(car.scrollWidth-car.clientWidth>4) centerCube(car,el,true);
    };
    el.addEventListener('click',e=>{
      if(e.target.closest('.pc-cta')) return;
      if(!el.classList.contains('sel')) selectThis();
    });
    el.querySelector('.pc-cta').addEventListener('click',ev=>{
      ev.stopPropagation();
      if(!el.classList.contains('sel')){ selectThis(); return; }
      if(c.free){ startFree(); } else { planClick(c.k); }
    });
    car.appendChild(el);
  });
  wrapEl.appendChild(prev);wrapEl.appendChild(car);wrapEl.appendChild(next);
  wrap.appendChild(wrapEl);
  const cardStep=()=>{const c=car.querySelector('.pcube');return c?c.getBoundingClientRect().width+12:240;};
  prev.onclick=()=>car.scrollBy({left:-cardStep(),behavior:'smooth'});
  next.onclick=()=>car.scrollBy({left:cardStep(),behavior:'smooth'});
  car.addEventListener('wheel',e=>{ if(car.scrollWidth-car.clientWidth>4 && Math.abs(e.deltaY)>Math.abs(e.deltaX)){ car.scrollLeft+=e.deltaY; e.preventDefault(); } },{passive:false});
  let down=false,sx=0,sl=0,rubber=false;
  car.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse')return; down=true;sx=e.clientX;sl=car.scrollLeft;rubber=(car.scrollWidth-car.clientWidth<=4);car.classList.add('dragging');car.style.transition='';try{car.setPointerCapture(e.pointerId);}catch(_){}});
  car.addEventListener('pointermove',e=>{ if(!down)return; const dx=e.clientX-sx; if(rubber){car.style.transform='translateX('+Math.max(-56,Math.min(56,dx*0.28))+'px)';}else{car.scrollLeft=sl-dx;} });
  const endDrag=()=>{ if(!down)return; down=false; car.classList.remove('dragging'); if(rubber){car.style.transition='transform .42s cubic-bezier(.22,1,.36,1)';car.style.transform='translateX(0)';} };
  car.addEventListener('pointerup',endDrag); car.addEventListener('pointercancel',endDrag);
  const syncNav=()=>{const sc=car.scrollWidth-car.clientWidth>4;prev.style.display=sc?'':'none';next.style.display=sc?'':'none';};
  car.scrollLeft=0; setTimeout(syncNav,30); window.addEventListener('resize',syncNav);
  // USDT(크립토) 결제 옵션 행 (유지)
  const cr=document.createElement('div');cr.className='crypto-row';
  cr.innerHTML=`<div class="crypto-label">💠 ${cryptoLabel()}</div>`;
  const cb=document.createElement('div');cb.className='crypto-btns';
  PLAN_DATA.forEach(p=>{const b=document.createElement('button');b.className='crypto-btn';b.type='button';
    b.textContent=`${T(p.nameKey)} ${p.total}`;b.onclick=()=>cryptoClick(p.k);cb.appendChild(b);});
  cr.appendChild(cb);wrap.appendChild(cr);
}
function startFree(){ try{ closeUpgrade(); }catch(_){}; window.scrollTo({top:0,behavior:'smooth'}); }
function renderPricing(){   // 메인 화면 요금제 섹션(항상 보임)
  buildPlanCards($('#pricingPlans'));
}
function openUpgrade(){
  if(!AUTH.enabled){ return; }
  const isPro = (PLAN==='pro');
  $('#upTitle').textContent = isPro ? T('plansTitle') : T('upTitle');
  $('#upSub').textContent   = isPro ? T('proNote')    : T('upSub');
  $('#upNote').textContent=T('upNote');
  buildPlanCards($('#plans'));
  $('#upgradeModal').style.display='flex';
}
function closeUpgrade(){ $('#upgradeModal').style.display='none'; }
$('#upBtn').onclick=openUpgrade;
$('#upClose').onclick=closeUpgrade;
$('#upgradeModal').addEventListener('click',e=>{ if(e.target===$('#upgradeModal')) closeUpgrade(); });
async function fetchUsage(){   // 로그인 직후/새로고침 시 남은 횟수 즉시 표시
  if(!AUTH.enabled || !AUTH.session || !AUTH.session.access_token) return;
  try{
    const r=await fetch('/api/usage',{headers:{'Authorization':'Bearer '+AUTH.session.access_token}});
    if(r.ok){ const u=await r.json(); if(u && u.limit!=null) updateUsage(u); }
  }catch(_){}
}
// 친구 초대(제휴 20%) — LS 제휴 가입 페이지로
const AFFILIATE_URL='https://runner-blog-auto.lemonsqueezy.com/affiliates';
$('#inviteBtn').onclick=()=>window.open(AFFILIATE_URL,'_blank');
{ const _rc=$('#referCta'); if(_rc) _rc.onclick=()=>window.open(AFFILIATE_URL,'_blank'); }
$('#loginBtn').onclick=openLogin;
$('#modalClose').onclick=closeLogin;
$('#loginModal').addEventListener('click',e=>{ if(e.target===$('#loginModal')) closeLogin(); });
$('#logoutBtn').onclick=async()=>{ if(SB) try{ await SB.auth.signOut(); }catch(_){} AUTH.session=null; updateAuthUI(); toast(T('logoutDone')); };
$('#magicBtn').onclick=async()=>{
  const email=$('#emailInput').value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast(T('emailInvalid')); return; }
  if(!SB){ toast('⚠ '+T('authErr')); return; }
  const b=$('#magicBtn'); b.disabled=true; b.innerHTML='<span class="spin"></span>'+T('sendMagic');
  try{
    const {error}=await SB.auth.signInWithOtp({email, options:{emailRedirectTo:location.origin}});
    if(error) throw error;
    toast(T('magicSent')); closeLogin();
  }catch(e){ toast('⚠ '+T('authErr')); }
  b.disabled=false; b.textContent=T('sendMagic');
};
$('#googleBtn').onclick=async()=>{
  if(!SB){ toast('⚠ '+T('authErr')); return; }
  try{
    const {error}=await SB.auth.signInWithOAuth({provider:'google', options:{redirectTo:location.origin}});
    if(error) throw error;
  }catch(e){ toast('⚠ '+T('authErr')); }
};

// ===== boot =====
LANG=pickLang();
$('#langSel').value=LANG;
applyI18n();
initAuth();
</script>
